[bdist_wheel]
# Python 3 only; not a universal (py2+py3) wheel
universal=0

[tool:pytest]
testpaths =
    cmapPy/pandasGEXpress/tests
    cmapPy/math/tests
    cmapPy/set_io/tests

[coverage:run]
source = cmapPy
omit =
    */tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
